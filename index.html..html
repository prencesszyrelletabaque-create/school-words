<title>School Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one tall column on a sky-blue desk. Brown tab on top, a row of five star slots,
   one big picture frame, then two chunky word buttons, each with its own speaker button. */
:root {
  --sky: #bfe4f1;
  --sky-dot: rgba(255, 255, 255, 0.45);
  --paper: #e8f5fb;
  --ink: #2b1d12;
  --brown: #5a3a1f;
  --wood: #8a5a2b;
  --a: #2f6fc4;
  --a-dark: #1d4a8e;
  --b: #bf5f0b;
  --b-dark: #86420a;
  --good: #3a8f40;
  --good-dark: #26652b;
  --star: #ffc72c;
  --star-edge: #d49100;
  --star-empty: rgba(255, 255, 255, 0.7);
  --star-empty-edge: #8db8cb;
  --display: 'Baloo 2', 'Chalkboard SE', 'Comic Sans MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--sky);
  background-image: radial-gradient(var(--sky-dot) 1.6px, transparent 1.6px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  padding-inline: 16px;
  padding-block: 0 32px;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
button:disabled { cursor: default; }

.game { max-width: 560px; margin-inline: auto; display: grid; gap: 18px; justify-items: center; }
.tab {
  background: var(--brown);
  color: #fff;
  font: 800 1.7rem/1 var(--display);
  padding: 8px 30px 12px;
  border-radius: 0 0 24px 24px;
  letter-spacing: 0.01em;
}

/* star row */
.stars { display: flex; gap: 8px; justify-content: center; }
.stars .s { width: 46px; height: 46px; fill: var(--star-empty); stroke: var(--star-empty-edge); stroke-width: 1.2; stroke-linejoin: round; transition: fill 0.2s; }
.stars .s.on { fill: var(--star); stroke: var(--star-edge); animation: pop-in 0.6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop-in { 0% { transform: scale(0.2) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }

.screen { width: 100%; display: grid; gap: 20px; justify-items: center; }

/* picture frame */
.frame {
  position: relative;
  width: min(100%, 340px, 44vh);
  aspect-ratio: 308 / 300;
  min-width: 0;
  background: var(--paper);
  border: 8px solid var(--wood);
  border-radius: 30px;
  box-shadow: 0 7px 0 rgba(90, 58, 31, 0.28);
  overflow: hidden;
}
.frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
.round {
  position: absolute; bottom: 8px;
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  border: 0; background: var(--brown); color: #fff;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
}
.round svg { width: 34px; height: 34px; fill: currentColor; }
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
#listen { right: 8px; }
#nextBtn { left: 8px; background: var(--good); animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

/* burst when the answer is right */
.burst { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.burst .big { width: 52%; height: 52%; fill: var(--star); stroke: var(--star-edge); stroke-width: 1; stroke-linejoin: round; animation: big-pop 1.2s ease-out forwards; }
.burst .spark { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; fill: var(--star); stroke: var(--star-edge); stroke-width: 1.2; animation: fly 0.95s ease-out forwards; }
@keyframes big-pop {
  0% { transform: scale(0.2) rotate(-25deg); opacity: 0; }
  35% { transform: scale(1.15) rotate(6deg); opacity: 1; }
  70% { transform: scale(1) rotate(0); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}
@keyframes fly {
  0% { transform: rotate(var(--r)) translateY(0) scale(0.4); opacity: 1; }
  100% { transform: rotate(var(--r)) translateY(-128px) scale(1); opacity: 0; }
}

/* the two choices */
.choices { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.opt { min-width: 0; display: grid; gap: 12px; justify-items: center; }
.say {
  width: 58px; height: 58px; border-radius: 50%; border: 0;
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
}
.say svg { width: 32px; height: 32px; fill: currentColor; }
.say:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
.opt[data-k="0"] { --c: var(--a); --cd: var(--a-dark); }
.opt[data-k="1"] { --c: var(--b); --cd: var(--b-dark); }
.opt .say { background: var(--cd); }
.pick {
  width: 100%; min-height: 88px; padding: 8px 6px;
  border: 0; border-radius: 24px;
  background: var(--c); color: #fff;
  font: 800 clamp(1.7rem, 7.4vw, 2.5rem)/1 var(--display);
  box-shadow: 0 7px 0 var(--cd);
  overflow-wrap: anywhere;
}
.pick:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 var(--cd); }
.pick.right { background: var(--good); box-shadow: 0 7px 0 var(--good-dark); animation: yay 0.6s ease-out; }
.pick.wrong { opacity: 0.4; animation: shake 0.45s; }
.opt.dim { opacity: 0.45; }
.opt.speaking .say { animation: ring 0.8s ease-in-out infinite; }
@keyframes yay { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes ring { 0%, 100% { box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 255, 255, 0.9); } 50% { box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 0 0 10px rgba(255, 255, 255, 0); } }
#listen.speaking { animation: ring 0.8s ease-in-out infinite; }

/* start and end screens */
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.thumbs img { width: 84px; height: 82px; object-fit: cover; border-radius: 16px; border: 4px solid var(--wood); background: var(--paper); }
.thumbs img:nth-child(2) { border-color: #3f8f3f; }
.thumbs img:nth-child(3) { border-color: #cf3a36; }
.thumbs img:nth-child(4) { border-color: #e2b21c; }
.thumbs img:nth-child(5) { border-color: #2f6fc4; }
.big-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  min-width: 200px; min-height: 88px; padding: 8px 32px;
  border: 0; border-radius: 28px;
  background: var(--good); color: #fff;
  font: 800 2rem/1 var(--display);
  box-shadow: 0 8px 0 var(--good-dark);
}
.big-btn svg { width: 46px; height: 46px; fill: currentColor; }
.big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--good-dark); }
.hint { margin: 0; max-width: 34ch; text-align: center; font-weight: 600; font-size: 0.95rem; line-height: 1.45; color: #3d4b52; }
.endtitle { margin: 0; font: 800 clamp(2rem, 9vw, 2.8rem)/1.05 var(--display); text-align: center; color: var(--brown); text-wrap: balance; }
.endstars { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.endstars svg { width: 64px; height: 64px; fill: var(--star); stroke: var(--star-edge); stroke-width: 1.2; stroke-linejoin: round; animation: pop-in 0.6s cubic-bezier(.2, 1.6, .4, 1) backwards; }
.endstars svg:nth-child(2) { animation-delay: 0.12s; }
.endstars svg:nth-child(3) { animation-delay: 0.24s; }
.endstars svg:nth-child(4) { animation-delay: 0.36s; }
.endstars svg:nth-child(5) { animation-delay: 0.48s; }

@media (max-height: 700px) { .game { gap: 12px; } .stars .s { width: 38px; height: 38px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

</svg>

<main class="game">
  <div class="tab">School Words</div>
  <div class="stars" id="stars" aria-label="Stars won"></div>

  <section class="screen" id="startScreen">
    <div class="thumbs" id="thumbs"></div>
    <button class="big-btn" id="startBtn" aria-label="Play"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg>Play</button>
    <p class="hint">Turn the volume up. A voice reads each picture question and each word out loud.</p>
  </section>

  <section class="screen" id="playScreen" hidden>
    <div class="frame">
      <img id="pic" alt="A picture of a school object">
      <div class="burst" id="burst" hidden aria-hidden="true"></div>
      <button class="round" id="nextBtn" aria-label="Next picture" hidden><svg viewBox="0 0 24 24"><use href="#i-next"/></svg></button>
      <button class="round" id="listen" aria-label="Hear the question again"><svg viewBox="0 0 24 24"><use href="#i-speaker"/></svg></button>
    </div>
    <div class="choices">
      <div class="opt" data-k="0">
        <button class="say" aria-label="Hear this word"><svg viewBox="0 0 24 24"><use href="#i-speaker"/></svg></button>
        <button class="pick"></button>
      </div>
      <div class="opt" data-k="1">
        <button class="say" aria-label="Hear this word"><svg viewBox="0 0 24 24"><use href="#i-speaker"/></svg></button>
        <button class="pick"></button>
      </div>
    </div>
  </section>

  <section class="screen" id="endScreen" hidden>
    <h1 class="endtitle" id="endTitle">You did it!</h1>
    <div class="endstars" id="endStars"></div>
    <button class="big-btn" id="againBtn" aria-label="Play again"><svg viewBox="0 0 24 24"><use href="#i-replay"/></svg>Again</button>
  </section>
</main>

  var opts = Array.prototype.slice.call(document.querySelectorAll('.opt'));

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function show(id) {
    ['startScreen', 'playScreen', 'endScreen'].forEach(function (s) { $(s).hidden = (s !== id); });
  }
  function buildStars() {
    var h = ''; for (var i = 0; i < TOTAL; i++) h += '<svg class="s" viewBox="0 0 24 24"><use href="#i-star"/></svg>';
    starsEl.innerHTML = h;
  }
  function questionText() {
    return 'What is this? ... Is it a ' + current.pair[0].word + '? ... Or a ' + current.pair[1].word + '?';
  }

  function showQuestion() {
    clearTimeout(advanceTimer);
    var item = ITEMS.filter(function (x) { return x.id === order[qi]; })[0];
    var others = ITEMS.filter(function (x) { return x.id !== item.id; });
    var other = others[Math.floor(Math.random() * others.length)];
    var pair = Math.random() < 0.5 ? [item, other] : [other, item];
    current = { item: item, pair: pair };
    answered = false;
    pic.src = IMGS[item.id];
    burst.hidden = true;
    nextBtn.hidden = true;
    opts.forEach(function (o, k) {
      var pick = o.querySelector('.pick'), say = o.querySelector('.say');
      pick.textContent = pair[k].word;
      pick.disabled = false;
      pick.className = 'pick';
      o.className = 'opt';
      say.setAttribute('aria-label', 'Hear the word ' + pair[k].word);
    });
    speak(questionText());
  }

  function startGame() {
    initAudio();
    order = shuffle(ITEMS.map(function (x) { return x.id; }));
    qi = 0;
    buildStars();
    show('playScreen');
    showQuestion();
  }

  function fireBurst() {
    var h = '<svg class="big" viewBox="0 0 24 24"><use href="#i-star"/></svg>';
    for (var i = 0; i < 8; i++) h += '<svg class="spark" style="--r:' + (i * 45) + 'deg" viewBox="0 0 24 24"><use href="#i-star"/></svg>';
    burst.innerHTML = h;
    burst.hidden = false;
    clearTimeout(burstTimer);
    burstTimer = setTimeout(function () { burst.hidden = true; }, 1300);
  }

  var PRAISE = [
    function (w) { return 'Yes! It is a ' + w + '. Good job!'; },
    function (w) { return 'Great! A ' + w + '. You got a star!'; },
    function (w) { return 'That is right! A ' + w + '. Super!'; },
    function (w) { return 'Yay! It is a ' + w + '. Well done!'; }
  ];

  function onPick(k) {
    if (answered) return;
    var o = opts[k], pick = o.querySelector('.pick');
    if (current.pair[k].id === current.item.id) {
      answered = true;
      pick.classList.add('right');
      opts.forEach(function (x, j) {
        if (j !== k) { x.classList.add('dim'); x.querySelector('.pick').disabled = true; }
      });
      var slot = starsEl.children[qi];
      if (slot) slot.classList.add('on');
      fireBurst();
      chime();
      nextBtn.hidden = false;
      var line = PRAISE[Math.floor(Math.random() * PRAISE.length)](current.item.word);
      setTimeout(function () {
        speak(line, function () { advanceTimer = setTimeout(next, 1300); });
      }, 450);
    } else {
      pick.classList.remove('wrong'); void pick.offsetWidth;
      pick.classList.add('wrong');
      pick.disabled = true;
      oops();
      speak('Oops! Try again.');
    }
  }

  function next() {
    clearTimeout(advanceTimer);
    qi++;
    if (qi >= TOTAL) finish(); else showQuestion();
  }

  function finish() {
    var h = ''; for (var i = 0; i < TOTAL; i++) h += STAR;
    $('endStars').innerHTML = h;
    $('endTitle').textContent = 'You got ' + TOTAL + ' stars!';
    show('endScreen');
    chime();
    setTimeout(function () { speak('Wow! You got ' + TOTAL + ' stars! You are a super star!'); }, 500);
  }

  /* ---------- wiring ---------- */
  $('thumbs').innerHTML = ITEMS.map(function (x) { return '<img src="' + IMGS[x.id] + '" alt="">'; }).join('');
  buildStars();
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  nextBtn.addEventListener('click', next);
  listenBtn.addEventListener('click', function () {
    listenBtn.classList.add('speaking');
    speak(questionText(), function () { listenBtn.classList.remove('speaking'); });
    setTimeout(function () { listenBtn.classList.remove('speaking'); }, 6000);
  });
  opts.forEach(function (o, k) {
    o.querySelector('.pick').addEventListener('click', function () { onPick(k); });
    o.querySelector('.say').addEventListener('click', function () {
      opts.forEach(function (x) { x.classList.remove('speaking'); });
      o.classList.add('speaking');
      speak(current.pair[k].word + '.', function () { o.classList.remove('speaking'); });
      setTimeout(function () { o.classList.remove('speaking'); }, 4500);
    });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && synth) { try { synth.cancel(); } catch (e) {} }
  });
})();
</script>

</body></html>
